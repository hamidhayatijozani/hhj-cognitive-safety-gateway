name: Sbat Tests
on:
  push:
    branches: ["main","feature/**"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run product tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Smoke-test CLI
        run: python -m sbat.cli --action smoke_test --impact low --evidence 1 --reliability 0.95
